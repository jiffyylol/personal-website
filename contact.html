        <main>
            <h1>Contact</h1>
            <p>Hi, send me a message or email me at <a href="mailto:anthonychuong@berkeley.edu">anthonychuong@berkeley.edu</a>.</p>

            
            <form class="contact-form">
                <label>
                    Name
                    <input type="text" name="name" required>
                </label>
                <label>
                    Email
                    <input type="email" name="email" required>
                </label>
                <label>
                    Message
                    <textarea name="message" rows="5" required></textarea>
                </label>
                <button type="submit">Send</button>
            </form>
